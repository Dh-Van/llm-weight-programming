[project]
name = "weightspace-mnist"
version = "0.1.0"
description = "No backprop: an LLM hand-designs convolutional feature neurons; a closed-form LDA readout finishes the classifier."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gymnasium[mujoco]>=1.0",
    "numpy>=2.0",
    "pillow>=10",
    "rich>=13",
]

[project.optional-dependencies]
audit = ["torch>=2.2", "torchvision>=0.17"]   # only for audit_verify.py

[project.scripts]
ws-eval = "weightspace.evaluate:main"
ws-generate = "weightspace.generate:main"
ws-show = "weightspace.show:main"
ws-sweep = "weightspace.sweep:main"
ws-explore = "weightspace.explore:main"
ws-data = "weightspace.datasets:main"
ws-walker = "weightspace.walker:main"
ws-walker-render = "weightspace.walker:render_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weightspace"]
